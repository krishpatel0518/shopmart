{% extends 'shop/basic.html' %}

{% block title%} {{product.product_name}} - My Awesome Cart{% endblock %}
{% block body %}
<div class="container my-4">
    <div class="row">
    <div class="col-md-4">
    <div class="row">
        <img src="/media/{{product.image}}" width="233px" height="385px">
    </div>
        <div class="row">
            <button class="btn btn-primary mx-3">Buy Now</button>
            <span id="divpr{{product.id}}" class="divpr">
    <button id="pr{{product.id}}" class="btn btn-primary cart">
        Add To Cart
    </button>
</span>
        </div>

    </div>

    <div class="col-md-8">
        <h5>{{product.product_name}}</h5>
        <p><b>Rs.{{product.price}} </b></p>
        <p>{{product.desc}}</p>


    </div>
    </div>


</div>




{% endblock %}

{% block js %}
<script>

// -------------------- CART --------------------

if(localStorage.getItem('cart') == null){
    var cart = {};
}
else{
    cart = JSON.parse(localStorage.getItem('cart'));
    updateCart(cart);
}

// Add to Cart
$('.cart').click(function(){

    var idstr = this.id.toString();

    if (cart[idstr] != undefined) {
    cart[idstr][0] = cart[idstr][0] + 1;
}
    else{

        var qty = 1;
        var name = document.getElementById('name'+idstr).innerHTML;

        cart[idstr] = [qty,name];

    }

    updateCart(cart);

});

// -------------------- UPDATE CART --------------------

function updateCart(cart){

    var sum = 0;

    for(var item in cart){

        sum += cart[item][0];

        document.getElementById('div'+item).innerHTML =

        "<button id='minus"+item+"' class='btn btn-primary minus'>-</button> " +

        "<span id='val"+item+"' class='mx-2'>"+cart[item][0]+"</span>" +

        "<button id='plus"+item+"' class='btn btn-primary plus'>+</button>";

    }

    localStorage.setItem('cart',JSON.stringify(cart));

    document.getElementById('cart').innerHTML = sum;

    updatePopover(cart);

}

// -------------------- PLUS --------------------

$('.divpr').on('click','button.plus',function(){

    var a = this.id.slice(6);

    cart['pr'+a][0]++;

    updateCart(cart);

});

// -------------------- MINUS --------------------

$('.divpr').on('click','button.minus',function(){

    var a = this.id.slice(7);

    cart['pr'+a][0]--;

    cart['pr'+a][0] = Math.max(0,cart['pr'+a][0]);

    if(cart['pr'+a][0]==0){

        document.getElementById('divpr'+a).innerHTML =
        "<button id='pr"+a+"' class='btn btn-primary cart'>Add To Cart</button>";

        delete cart['pr'+a];

    }

    updateCart(cart);

});

// -------------------- POPOVER --------------------

$('#popcart').popover();

updatePopover(cart);

function updatePopover(cart){

    var popStr = "<h5>Your Shopping Cart</h5><div class='mx-2 my-2'>";

    var i = 1;

    for(var item in cart){

        popStr += "<b>"+i+"</b>. ";

        popStr += cart[item][1].slice(0,25);

        popStr += "... Qty : "+cart[item][0]+"<br>";

        i++;

    }

    popStr += "</div>";

    popStr += "<a href='/shop/checkout'><button class='btn btn-primary btn-sm'>Checkout</button></a> ";

    popStr += "<button class='btn btn-danger btn-sm ml-2' onclick='clearCart()'>Clear Cart</button>";

    document.getElementById('popcart').setAttribute('data-content',popStr);

    $('#popcart').popover('show');

}

// -------------------- CLEAR CART --------------------

function clearCart(){

    localStorage.clear();

    cart = {};

    location.reload();

}

</script>
{% endblock %}
